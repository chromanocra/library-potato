<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Perpustakaan</title>
  
  <link rel="stylesheet" type="text/css" href="../css2/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="../css2/style.css">
  <link rel="stylesheet" href="../css2/responsive.css">
  <link rel="stylesheet" href="../css2/jquery.mCustomScrollbar.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  <link rel="icon" type="image/png" href="../images/s.png">

  <style>
    /* KITA MASUKIN STYLE CUSTOM DI SINI AJA BIAR GAK BERGANTUNG FILE LUAR */
    body {
      min-height: 100vh;
      background-color: #f8f9fa; /* Warna dasar abu-abu sangat muda khas bootstrap */
    }
    
    header {
      background-size: cover;
      background-position: center;
      height: 50vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: rgb(106, 255, 0);
      text-align: center;
    }

    h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    
    .layout-card-custom { 
      display: flex; 
      flex-wrap: wrap; 
      justify-content: center; 
      gap: 1.5rem; 
    }
    
    /* Hover Card Buku */
    #wrapThumbnail { position: relative; }
    #thumbnailCard {
      background-color: rgba(255, 255, 255, 0.903);
      position: absolute;
      top: 0;
      height: 100%;
      width: 100%;
      text-align: center;
      padding-top: 70%;
      color: white;
      font-size: 20px;
      display: none;
    }
    #thumbnailCard span { display: block; }
    #thumbnailCard a {
      text-decoration: none;
      color: white;
      display: block;
      width: 100px;
      margin: 0 auto;
      border: 1px solid #22c55e;
      background-color: #22c55e;
      padding: 5px;
      border-radius: 5px;
    }
    #thumbnailCard a:hover { 
      background-color: #16a34a; 
      color: white; 
    }
    #wrapThumbnail img { width: 100%; height: auto; border-radius: 8px;}
    #wrapThumbnail:hover #thumbnailCard { display: block; }
    
    /* Animasi Alert */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    .alert-success { animation: fadeIn 0.5s ease-in-out forwards; }
    .alert-fade-out { animation: fadeOut 0.5s ease-in-out forwards; }
    
    /* Form Search */
    form { 
      display: flex; 
      align-items: center; 
      justify-content: flex-end; 
      margin-bottom: 20px;
    }
    i.fa-search { margin-right: 10px; color: #555; }
    input.search-input { 
      width: 250px; 
      padding: 8px 15px; 
      border: 1px solid #ccc; 
      border-radius: 20px; 
      outline: none;
    }
    input.search-input:focus { border-color: #16a34a; }
  </style>
</head>

<body>
  <div class="header_section shadow-sm bg-white">
    <div class="container-fluid">
      <nav class="navbar navbar-expand-lg navbar-light">
        <a class="navbar-brand" href="#"><img src="../images/s.png" alt="Logo" width="40"></a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto"> <li class="nav-item">
              <a class="nav-link active fw-bold" href="#">Daftar Buku</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="daftar_pinjam.html">Peminjaman</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="history.html">History</a>
            </li>
            <li class="nav-item ms-lg-3">
              <a class="btn btn-outline-danger btn-sm mt-1" href="#" id="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </li>
          </ul>
        </div>
      </nav>
    </div>
  </div>

  <section id="homeSection" class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-12">

        <div class="alert alert-success shadow-sm" id="welcome-alert" role="alert" style="display: none;">
          <i class="fas fa-check-circle"></i> Selamat Datang, <strong class="text-capitalize" id="nama-user">User</strong>!
        </div>

        <form id="form-pencarian">
          <i class="fas fa-search"></i>
          <input id="keyword" name="keyword" type="search" class="search-input" placeholder="Cari buku...">
        </form>

        <div class="layout-card-custom" id="wadah-buku">
            <p class="text-center w-100 text-muted"><i class="fas fa-spinner fa-spin"></i> Sedang memuat data buku...</p>
        </div>

      </div>
    </div>
  </section>
  <br><br>

  <div class="footer_section layout_padding bg-dark text-white pt-5 pb-4 mt-5">
    <div class="container">
      <div class="row">
        <div class="col-lg-4 col-md-6 mb-4">
          <h5 class="text-uppercase mb-3 text-success fw-bold">Alamat</h5>
          <p class="text-light">Jl. Swadaya Rt.02/03 No. 13 Tapos, Kota Depok</p>
          <a href="#" target="_blank" class="btn btn-outline-success btn-sm mt-2">Buka di Maps</a>
        </div>
        <div class="col-lg-4 col-md-6 mb-4 text-lg-center">

            <a href="#" target="_blank" class="text-white me-3" style="font-size: 24px;"><i class="fab fa-github"></i></a>
            <a href="#" target="_blank" class="text-white" style="font-size: 24px;"><i class="fab fa-instagram"></i></a>
          </div>
        </div>
        <div class="col-lg-4 col-md-12 text-lg-end">
          <h5 class="text-uppercase mb-3 text-success fw-bold">Telepon</h5>
          <p class="text-light"><i class="fas fa-phone-alt"></i> +62 856 9256 9477</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
